[project]
name = "graduation-project-gp27"
version = "0.1.0"
description = "Pandapower time-series simulation for Graduation Project GP27"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pandapower>=3.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]
